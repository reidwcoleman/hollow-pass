<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hollow Pass</title>
<style>
  :root { --ink: #dfe6f2; --dim: rgba(223,230,242,.55); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Helvetica Neue", Helvetica, Inter, Arial, sans-serif; color: var(--ink); }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  #hud.on { opacity: 1; }
  #speedo { position: absolute; left: 34px; bottom: 28px; display: flex; align-items: baseline; gap: 10px; text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  #speed { font-size: 64px; font-weight: 200; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  #speedo .u { font-size: 13px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  #gear { font-size: 22px; font-weight: 300; padding: 2px 10px; border: 1px solid rgba(223,230,242,.25); border-radius: 4px; margin-left: 10px; }
  #env { position: absolute; right: 34px; bottom: 30px; text-align: right; font-size: 13px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; line-height: 1.9; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #env b { color: var(--ink); font-weight: 300; font-size: 16px; }
  #radio { position: absolute; left: 34px; top: 28px; font-size: 11px; letter-spacing: 2px; color: rgba(255,160,90,.7); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #clock { position: absolute; right: 34px; top: 28px; font-size: 13px; letter-spacing: 3px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #loc { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); text-align: center; opacity: 0; }
  #loc.show { animation: loc 6.5s ease forwards; }
  @keyframes loc { 0% { opacity: 0; transform: translate(-50%, 8px);} 12% { opacity: 1; transform: translate(-50%, 0);} 80% { opacity: 1;} 100% { opacity: 0;} }
  #locName { font-size: 34px; font-weight: 200; letter-spacing: 8px; text-transform: uppercase; text-shadow: 0 2px 24px rgba(0,0,0,.9); }
  #locSub { font-size: 12px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; margin-top: 8px; }
  #flash { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(120,0,0,0) 40%, rgba(90,0,0,.55) 100%); opacity: 0; pointer-events: none; }
  #flash.on { animation: fl 1.4s ease-out forwards; }
  @keyframes fl { 0% { opacity: 1;} 100% { opacity: 0;} }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 60%, rgba(8,12,22,.55), rgba(0,0,0,.92)); transition: opacity 1.6s ease; z-index: 5; }
  #title.off { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(44px, 9vw, 112px); font-weight: 100; letter-spacing: .32em; margin: 0 0 6px .32em; text-transform: uppercase; color: #e9eef8; text-shadow: 0 0 60px rgba(120,160,255,.25); }
  #title .tag { font-size: 12px; letter-spacing: 6px; text-transform: uppercase; color: var(--dim); margin-bottom: 44px; }
  #bar { width: min(420px, 70vw); height: 1px; background: rgba(255,255,255,.12); position: relative; margin-bottom: 14px; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #cfd9ee; transition: width .3s ease; box-shadow: 0 0 14px rgba(200,215,255,.8); }
  #status { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); min-height: 16px; }
  #start { margin-top: 42px; font-size: 13px; letter-spacing: 5px; text-transform: uppercase; color: #e9eef8; border: 1px solid rgba(233,238,248,.35); padding: 14px 34px; cursor: pointer; opacity: 0; transition: opacity .8s; background: rgba(0,0,0,.3); }
  #start.ready { opacity: 1; }
  #start:hover { background: rgba(233,238,248,.1); }
  #keys { margin-top: 26px; font-size: 11px; letter-spacing: 2px; color: rgba(223,230,242,.4); text-transform: uppercase; display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; }
  #keys span b { color: var(--dim); font-weight: 400; }
  #hint { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(223,230,242,.45); opacity: 0; transition: opacity 1s; }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="radio">88.1 FM   ▮▯▯▯▯▯▯▯   no signal</div>
  <div id="clock">02:47</div>
  <div id="loc"><div id="locName"></div><div id="locSub"></div></div>
  <div id="speedo"><span id="speed">0</span><span class="u">km/h</span><span id="gear">N</span></div>
  <div id="env"><div><b id="alt">0 m</b> &nbsp;elev</div><div><b id="temp">-12.0°C</b> &nbsp;outside</div></div>
  <div id="hint">W / ↑ accelerate · S / ↓ brake · space handbrake · V camera · H lights · R recover</div>
</div>
<div id="flash"></div>
<div id="title">
  <h1>Hollow Pass</h1>
  <div class="tag">a night drive · county route 9</div>
  <div id="bar"><i></i></div>
  <div id="status">loading</div>
  <div id="start">Drive</div>
  <div id="keys"><span><b>W A S D</b> drive</span><span><b>space</b> handbrake</span><span><b>V</b> camera</span><span><b>H</b> headlights</span><span><b>R</b> recover</span></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
